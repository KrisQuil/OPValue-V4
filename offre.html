<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre approche | OPValue+ – Operating Partners</title>
<meta name="description" content="La solution OPValue+ en 4 étapes : premier échange gratuit, Diag Flash, OBR/IBR, puis accompagnement à l'exécution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- PAGE HEADER -->
<section class="page-header">
  <div class="page-header-inner">
    <h1>Une solution qui relie stratégie, exécution et <em>engagement</em></h1>
  </div>
</section>

<!-- PROMESSE -->
<section class="promise" id="promesse">
  <div class="promise-inner">
    <div class="section-label reveal">Notre promesse</div>
    <h2 class="section-title reveal">Décider vite. Exécuter juste. Tenir le cap <em>avec vous.</em></h2>
    <div class="promise-grid" id="prom-grid"></div>
  </div>
</section>

<!-- SOLUTION PHASES -->
<section class="solution" id="solution">
  <div class="solution-inner">
    <h2 class="section-title reveal">Notre démarche en <em>4 étapes</em></h2>
    <div class="solution-cards" id="solution-cards"></div>
  </div>
</section>

<!-- SITUATIONS -->
<section class="situations" id="situations">
  <div class="situations-inner">
    <h2 class="section-title reveal">Nos domaines d'<em>intervention</em></h2>
    <div class="sit-grid" id="situations-grid"></div>
  </div>
</section>

<!-- CTA BANNER -->
<section class="cta-banner">
  <div class="cta-banner-inner">
    <div class="cta-item reveal reveal-delay-1"><a href="references.html">Voir nos missions <span class="arrow">→</span></a></div>
    <div class="cta-divider"></div>
    <div class="cta-item reveal reveal-delay-2"><a href="contact.html">Parlons de vos enjeux <span class="arrow">→</span></a></div>
  </div>
</section>

<script src="js/site-content.js"></script>
<script src="js/site-images.js"></script>
<script src="js/tous-les-membres.js"></script>
<script src="js/membres/fp.js"></script>
<script src="js/membres/ol.js"></script>
<script src="js/membres/cq.js"></script>
<script src="js/membres/fg.js"></script>
<script src="js/membres/bdp.js"></script>
<script src="js/membres/nb.js"></script>
<script src="js/membres/bh.js"></script>
<script src="js/components.js"></script>
<script>
const C = SITE_CONTENT;

// Promise cards (déplacées depuis la home)
if (C.promesse) {
  document.getElementById('prom-grid').innerHTML = C.promesse.items.map((p,i) =>
    `<div class="promise-card reveal reveal-delay-${(i%4)+1}">
       <div class="promise-head">
         <div class="promise-icon">${p.icon}</div>
         <h4>${p.titre}</h4>
       </div>
       <p>${p.texte}</p>
     </div>`).join('');
}

// Solution cards from SITE_CONTENT
if (C.solution) {
  const ordSuffix = ['er','e','e','e'];
  const cards = C.solution.phases.map((phase, i) => {
    const items = phase.items.map(item => `<li>${item}</li>`).join('');
    const footer = phase.badge
      ? `<div class="sol-badge-wrap"><span class="sol-badge">${phase.badge}</span></div>`
      : (phase.duree ? `<div class="sol-duration">⏱ ${phase.duree}</div>` : '');
    return `<div class="sol-card reveal reveal-delay-${i+1}">
      <div class="sol-tag"><span class="sol-step-n">${i+1}</span><sup>${ordSuffix[i]}</sup> étape</div>
      <h4>${phase.code}</h4>
      <p class="sol-desc">${phase.titre}</p>
      <ul>${items}</ul>
      ${footer}
    </div>`;
  }).join('');
  document.getElementById('solution-cards').innerHTML = cards;
}

// Situations from SITE_CONTENT
if (C.situations) {
  const descriptions = {
    "Gouvernance & Actionnariat": "Aligner les intérêts, structurer la gouvernance",
    "Stratégie & Modèle économique": "Clarifier la vision, pivoter le modèle",
    "Croissance & Scalabilité": "Passer à l'échelle, structurer les opérations",
    "International & Partenariat": "Développement international, alliances stratégiques",
    "Innovation & Digitalisation": "IA, transformation digitale",
    "Résilience & Retournement": "Gestion de crise, restructuration",
    "Leadership & Organisation": "Renforcer le management, mobiliser les équipes",
    "Finance & Pilotage": "Levées de fonds, M&A",
    "Transmission & Cession": "Préparation à la cession, valorisation",
  };
  document.getElementById('situations-grid').innerHTML = C.situations.items.map((item, i) =>
    `<div class="sit-item reveal reveal-delay-${(i%4)+1}">
       <h5>${item}</h5>
       <p>${descriptions[item] || ''}</p>
     </div>`
  ).join('');
}

COMPONENTS.init('offre');
</script>
</body>
</html>
