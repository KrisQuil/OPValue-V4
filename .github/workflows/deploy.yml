# .github/workflows/deploy.yml — OPValue+
# Déploiement automatique vers OVH déclenché par push d'un tag `release-v*`
#
# DÉCLENCHEUR : push d'un tag matchant `release-v*`
#               (ex: release-v0.1, release-v1.0.0, release-v2.3.1-hotfix)
#               Le tag peut pointer sur HEAD ou sur n'importe quel commit antérieur.
# CIBLE       : hébergement OVH (mutualisé FTPS ou VPS SSH)
#
# ────────────────────────────────────────────────────────
# PRÉREQUIS — Secrets GitHub à configurer AVANT activation
# (Settings → Secrets and variables → Actions → New secret)
#
# Pour OVH mutualisé (FTP) :
#   OVH_FTP_HOST      ex: ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_USER      ex: opvalueplus
#   OVH_FTP_PASSWORD  mot de passe FTP OVH
#   OVH_FTP_PATH      répertoire cible sur le serveur, ex: /www/
#
# Pour OVH VPS (SSH/rsync) — voir job alternatif en bas :
#   OVH_SSH_HOST          IP ou hostname du VPS
#   OVH_SSH_USER          ex: ubuntu
#   OVH_SSH_PRIVATE_KEY   clé privée SSH (contenu complet avec -----BEGIN...)
#   OVH_SSH_PATH          répertoire web, ex: /var/www/opvalueplus.com
# ────────────────────────────────────────────────────────

name: Deploy OPValue+ to OVH

on:
  push:
    tags:
      - 'release-v*'

  # Permet un déclenchement manuel depuis l'UI GitHub (Actions → Run workflow)
  # Sélectionne le tag à déployer via le dropdown "Use workflow from"
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────
  # JOB A : Déploiement FTP vers OVH mutualisé
  # → Méthode recommandée pour hébergement mutualisé OVH
  # ──────────────────────────────────────────────────
  deploy-ftp:
    name: Deploy via FTP (OVH Mutualisé)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code (au ref qui a déclenché le workflow)
        uses: actions/checkout@v4

      - name: Affiche le ref déployé
        run: |
          echo "Tag déclencheur : ${GITHUB_REF#refs/tags/}"
          echo "Commit déployé  : ${GITHUB_SHA}"

      - name: Vérification — fichiers sensibles absents
        run: |
          echo "=== Vérification fichiers sensibles ==="
          # Bloquer si un fichier interne sensible est présent dans le bundle
          if find . -path './.git' -prune -o \
             \( -name "CLAUDE.md" -o -path "*/documentation/*" -o -path "*/missions/*" \) \
             -print | grep -q .; then
            echo "ERREUR : fichiers internes détectés dans le bundle !"
            find . -path './.git' -prune -o \
               \( -name "CLAUDE.md" -o -path "*/documentation/*" -o -path "*/missions/*" \) \
               -print
            exit 1
          fi
          echo "OK — aucun fichier sensible détecté."

      - name: Déploiement FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.OVH_FTP_HOST }}
          username: ${{ secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Répertoire LOCAL source (racine du repo, sans le .git)
          local-dir: ./
          # Répertoire DISTANT cible sur OVH
          server-dir: ${{ secrets.OVH_FTP_PATH }}
          # Fichiers à exclure du déploiement
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/_Ne pas déployer/**
            **/documentation/**
            **/missions/**
            **/*.md
            **/_config.yml
            **/Audit_*.docx
            **/images/_backup*

  # ──────────────────────────────────────────────────
  # JOB B : Déploiement SSH/rsync vers OVH VPS
  # → Décommenter ce job et commenter le job A si l'hébergement
  #   est un VPS OVH avec accès SSH
