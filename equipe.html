<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'équipe | OPValue+ – Operating Partners</title>
<meta name="description" content="Découvrez nos Operating Partners : des dirigeants expérimentés et complémentaires, formés au programme CAPOP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<!-- SEO : canonical + Open Graph + Twitter Card -->
<link rel="canonical" href="https://opvalueplus.com/equipe.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OPValue+">
<meta property="og:title" content="L'équipe | OPValue+ – Operating Partners">
<meta property="og:description" content="Découvrez nos Operating Partners : des dirigeants expérimentés et complémentaires, formés au programme CAPOP.">
<meta property="og:url" content="https://opvalueplus.com/equipe.html">
<meta property="og:image" content="https://opvalueplus.com/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="L'équipe | OPValue+ – Operating Partners">
<meta name="twitter:description" content="Découvrez nos Operating Partners : des dirigeants expérimentés et complémentaires, formés au programme CAPOP.">
<meta name="twitter:image" content="https://opvalueplus.com/images/og-image.jpg">
</head>
<body>

<!-- PAGE HEADER -->
<section class="page-header">
  <div class="page-header-inner">
    <h1>À vos côtés, des dirigeants qui ont déjà <em>tenu la barre</em></h1>
  </div>
</section>

<!-- COLLECTIF -->
<section class="collectif">
  <div class="collectif-inner">
    <div class="collectif-top">
      <div class="collectif-intro">
        <h2 class="section-title reveal">Notre <em>collectif</em></h2>
        <p class="collectif-desc reveal" id="collectif-lead"></p>
      </div>
      <div class="collectif-image reveal">
        <img src="images/groupe-op.jpg" alt="Le collectif OPValue+, 7 Operating Partners">
      </div>
    </div>

    <div class="team-badges reveal">
      <div class="team-badge">🎓 Certifiés CAPOP</div>
      <div class="team-badge">🌐 Réseau d'experts</div>
      <div class="team-badge">📈 Anciens dirigeants</div>
    </div>

    <div class="collectif-grid" id="collectif-cards"></div>
  </div>
</section>

<!-- TEAM -->
<section class="team" id="team-section">
  <div class="team-inner">
    <div class="section-label reveal">Tous nos operating partners</div>
    <h2 class="section-title reveal">L'<em>équipe</em></h2>
    <div class="team-grid" id="team-grid"></div>
  </div>
</section>

<!-- CTA BANNER -->
<section class="cta-banner">
  <div class="cta-banner-inner">
    <div class="cta-item reveal reveal-delay-1"><a href="references.html">Voir nos missions <span class="arrow">→</span></a></div>
    <div class="cta-divider"></div>
    <div class="cta-item reveal reveal-delay-2"><a href="contact.html">Parlons de vos enjeux <span class="arrow">→</span></a></div>
  </div>
</section>

<script src="js/site-content.js"></script>
<script src="js/site-images.js"></script>
<script src="js/tous-les-membres.js"></script>
<script src="js/membres/fp.js"></script>
<script src="js/membres/ol.js"></script>
<script src="js/membres/cq.js"></script>
<script src="js/membres/fg.js"></script>
<script src="js/membres/bdp.js"></script>
<script src="js/membres/nb.js"></script>
<script src="js/membres/bh.js"></script>
<script src="js/components.js"></script>
<script>
const C = SITE_CONTENT;

// Collectif — paragraphe d'intro + 3 blocs (Notre origine / Notre diversité / Notre écosystème)
if (C.collectif) {
  const leadEl = document.getElementById('collectif-lead');
  if (leadEl && C.collectif.lead) leadEl.innerHTML = C.collectif.lead;

  document.getElementById('collectif-cards').innerHTML =
    C.collectif.blocs.map((bloc, i) =>
      `<div class="collectif-card reveal reveal-delay-${(i%4)+1}">
         <h4>${bloc.titre}</h4>
         <p>${bloc.texte}</p>
       </div>`
    ).join('');
}

// Team grid
const teamGrid = document.getElementById('team-grid');
const membres = COMPONENTS.getAllMembres();

if (membres && membres.length > 0) {
  membres.forEach((m, idx) => {
    const missionCount = (m.missions || []).length;
    const opNameForUrl = encodeURIComponent(`${m.prenom} ${m.nom}`);
    const missionLabel = `${missionCount} mission${missionCount > 1 ? 's' : ''} réalisée${missionCount > 1 ? 's' : ''}`;

    const card = document.createElement('div');
    card.className = `member reveal reveal-delay-${(idx%4)+1}`;
    card.id = `fiche-${m.id}`;  // ancre pour liens depuis les cartes mission (references.html)
    card.innerHTML = `
      <div class="member-top">
        <div class="member-avatar">
          <img src="" data-portrait="${m.id}" onerror="this.style.display='none'" alt="${m.prenom} ${m.nom}">
        </div>
        <div class="member-info">
          <h5>${m.prenom} <span class="nom-fam">${m.nom}</span></h5>
          <div class="member-focus">${m.expertises}</div>
        </div>
      </div>
      <p><strong>Cibles :</strong> ${m.cibles}</p>
      <p><strong>Secteurs :</strong> ${m.secteurs}</p>
      <div class="member-actions">
        <a href="references.html?op=${opNameForUrl}" class="member-missions-link" aria-label="Voir les ${missionLabel} de ${m.prenom} ${m.nom}">${missionLabel} →</a>
        <a href="${m.linkedin}" class="member-linkedin" target="_blank" rel="noopener">LinkedIn →</a>
      </div>
    `;
    teamGrid.appendChild(card);
  });

  COMPONENTS.injectPortraits();
}

COMPONENTS.init('equipe');
</script>
</body>
</html>
